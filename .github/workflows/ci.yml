name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # liblouis lets the braille tests compare against the reference translator live,
      # not only against the stored fixtures.
      - name: Install liblouis
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends liblouis-bin
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Type check and build
        run: npm run build
